name: Build cpiccode for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone opencode source
        run: |
          git clone --depth 1 https://github.com/anomalyco/opencode.git opencode-src

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rename opencode to cpiccode
        working-directory: opencode-src
        shell: pwsh
        run: |
          # Rename in packages/opencode/package.json
           = Get-Content "packages/opencode/package.json" -Raw
           =  -replace '"name":\s*"opencode"', '"name": "cpiccode"'
          Set-Content "packages/opencode/package.json" -Value 

          # Rename in packages/opencode/script/build.ts - output binary name
           = Get-Content "packages/opencode/script/build.ts" -Raw
           =  -replace 'outfile:\s*dist/\\$\{name\}/bin/opencode', 'outfile: dist/${name}/bin/cpiccode'
           =  -replace '--user-agent=opencode/', '--user-agent=cpiccode/'
          Set-Content "packages/opencode/script/build.ts" -Value 

          # Rename in packages/opencode/package.json bin field if exists
          if (Test-Path "packages/opencode/package.json") {
             = Get-Content "packages/opencode/package.json" -Raw
             =  -replace '"bin":\s*\{\s*"opencode"', '"bin": { "cpiccode"'
            Set-Content "packages/opencode/package.json" -Value 
          }

          echo "=== package.json ==="
          Get-Content "packages/opencode/package.json" | Select-String -Pattern "name|bin" | Select-Object -First 10
          echo ""
          echo "=== build.ts changes ==="
          Get-Content "packages/opencode/script/build.ts" | Select-String -Pattern "cpiccode|opencode" | Select-Object -First 10

      - name: Install dependencies
        working-directory: opencode-src
        run: bun install

      - name: Build single binary for Windows
        working-directory: opencode-src
        run: |
          cd packages/opencode
          bun run script/build.ts --single

      - name: List build output
        shell: pwsh
        working-directory: opencode-src
        run: |
          echo "=== Build output ==="
          Get-ChildItem -Recurse packages/opencode/dist -ErrorAction SilentlyContinue | Select-Object FullName, Length | Format-Table -AutoSize
          echo ""
          echo "=== Searching for cpiccode binary ==="
          Get-ChildItem -Recurse packages/opencode/dist -Filter "cpiccode*" -ErrorAction SilentlyContinue | Select-Object FullName, Length
          echo ""
          echo "=== Searching for any binary ==="
          Get-ChildItem -Recurse packages/opencode/dist -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Get-ChildItem -Recurse packages/opencode/dist/bin -ErrorAction SilentlyContinue | Select-Object FullName, Length

      - name: Package binary
        shell: pwsh
        working-directory: opencode-src
        run: |
          # Find the built binary directory
          $distDir = Get-ChildItem packages/opencode/dist -Directory | Where-Object { $_.Name -like "cpiccode-windows*" } | Select-Object -First 1
          if ($distDir) {
            $binDir = Join-Path $distDir.FullName "bin"
            $zipPath = Join-Path (Get-Location) "cpiccode-windows-x64.zip"
            
            # Copy binary and rename to cpiccode.exe if needed
            $exeFile = Get-ChildItem $binDir -Filter "cpiccode" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exeFile) {
              $exeFile = Get-ChildItem $binDir -Filter "cpiccode.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if (-not $exeFile) {
              $exeFile = Get-ChildItem $binDir | Select-Object -First 1
            }
            
            Write-Host "Found binary: $($exeFile.FullName)"
            
            Compress-Archive -Path $binDir -DestinationPath $zipPath
            Write-Host "Created: $zipPath"
          } else {
            Write-Host "No cpiccode-windows directory found. Listing dist:"
            Get-ChildItem packages/opencode/dist
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpiccode-windows-x64
          path: opencode-src/cpiccode-windows-x64.zip
          if-no-files-found: warn
          retention-days: 7