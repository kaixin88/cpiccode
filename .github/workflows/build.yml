name: Build cpiccode for Windows

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone opencode source
        run: git clone --depth 1 https://github.com/anomalyco/opencode.git opencode-src

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rename opencode to cpiccode
        run: node rename.js

      - name: Install dependencies
        working-directory: opencode-src
        run: bun install

      - name: Build single binary for Windows
        working-directory: opencode-src/packages/opencode
        run: bun run script/build.ts --single

      - name: List build output
        shell: bash
        working-directory: opencode-src
        run: |
          echo "=== Build output ==="
          find packages/opencode/dist -type f 2>/dev/null | head -50
          echo ""
          echo "=== All bin directory contents ==="
          ls -la packages/opencode/dist/*/bin/ 2>/dev/null || echo "No bin dir found"

      - name: Package binary
        shell: bash
        working-directory: opencode-src
        run: |
          BINDIR=\
          echo "Binary directory: \"
          ls -la "\"/
          
          if [ -d "\" ]; then
            cd "\"
            for f in *; do
              if [ -f "\" ]; then
                echo "Found binary: \"
                if [ "\" != "cpiccode.exe" ]; then
                  cp "\" "cpiccode.exe" 2>/dev/null || cp "\" "cpiccode" 2>/dev/null || true
                fi
              fi
            done
            cd /
            cd "\/\"
            zip -r "\/cpiccode-windows-x64.zip" .
            cd "\"
            ls -la cpiccode-windows-x64.zip
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpiccode-windows-x64
          path: opencode-src/cpiccode-windows-x64.zip
          if-no-files-found: warn
          retention-days: 7