name: Build cpiccode

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone opencode source
        run: git clone --depth 1 https://github.com/anomalyco/opencode.git opencode-src

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rename and patch source code
        run: node build-and-patch.js

      - name: Install dependencies
        working-directory: opencode-src
        run: bun install

      - name: Build single binary for Windows
        working-directory: opencode-src/packages/opencode
        run: bun run script/build.ts --single

      - name: Package binary
        run: node package-binary.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpiccode-windows-x64
          path: opencode-src/cpiccode-windows-x64.zip
          if-no-files-found: error
          retention-days: 7