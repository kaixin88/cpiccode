name: Build cpiccode

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone opencode source
        run: git clone --depth 1 https://github.com/anomalyco/opencode.git opencode-src

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rename and patch source code
        run: node build-and-patch.js

      - name: Install dependencies
        working-directory: opencode-src
        run: bun install

      - name: Build single binary for Windows
        working-directory: opencode-src/packages/opencode
        run: bun run script/build.ts --single

      - name: Find and package binary
        shell: bash
        working-directory: opencode-src
        run: |
          echo "=== Build output ==="
          find packages/opencode/dist -type f 2>/dev/null | head -30
          echo ""
          BINDIR=
          echo "Binary dir: "
          if [ -n "" ] && [ -d "" ]; then
            ls -la ""/
            cd ""
            for f in *; do
              if [ -f ".github/workflows/build.yml" ] && [ ".github/workflows/build.yml" != "cpiccode.exe" ] && [ ".github/workflows/build.yml" != "cpiccode" ]; then
                cp ".github/workflows/build.yml" cpiccode.exe 2>/dev/null || cp ".github/workflows/build.yml" cpiccode 2>/dev/null || true
                echo "Copied .github/workflows/build.yml -> cpiccode.exe"
              fi
            done
            cd /
            cd "/"
            zip -r "/cpiccode-windows-x64.zip" .
            cd ""
            echo "Created: cpiccode-windows-x64.zip"
            ls -la cpiccode-windows-x64.zip
          else
            echo "ERROR: No binary directory found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpiccode-windows-x64
          path: opencode-src/cpiccode-windows-x64.zip
          if-no-files-found: error
          retention-days: 7